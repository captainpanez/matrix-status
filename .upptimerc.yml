owner: captainpanez
repo: matrix-status

sites:
  - name: Matrix Status Page
    url: https://matrix.wispbyte.app/healthz
    expectedStatusCodes:
      - 200
  - name: Matrix API
    url: https://matrix.wispbyte.app/api/status
    expectedStatusCodes:
      - 200

status-website:
  baseUrl: /matrix-status
  name: Matrix97 Status
  introTitle: "**Matrix97** uptime monitor"
  introMessage: Live uptime and response time for the Matrix97 Discord bot, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: Live dashboard
      href: https://matrix.wispbyte.app

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"
